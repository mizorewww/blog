name: Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # posts show their commit history

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The build optimizes images with scripts/prepare-image.py.
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/images/**', 'scripts/prepare-image.py') }}
          restore-keys: images-

      - name: Test
        run: go test ./...

      - name: Build
        run: go run .

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Missing CLOUDFLARE_API_TOKEN secret" && exit 1)
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME" || (echo "::error::Missing CLOUDFLARE_PAGES_PROJECT_NAME repository variable" && exit 1)

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy public --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # Reports performance regressions on every push. It runs beside the deploy
  # rather than gating it: shared runners make single scores noisy.
  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache optimized images
        uses: actions/cache@v4
        with:
          path: .cache/images
          key: images-${{ hashFiles('content/images/**', 'scripts/prepare-image.py') }}
          restore-keys: images-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Measure every post
        run: |
          go build -o blog .
          ./blog -url http://localhost:8080 -serve localhost:8080 &
          for i in $(seq 30); do curl -sf http://localhost:8080/ >/dev/null && break; sleep 1; done
          sh scripts/lighthouse.sh http://localhost:8080
